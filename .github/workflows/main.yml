name: CI - Simple Test & Manual Run

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  basic-check:
    name: Basic Check (lint/build/test placeholders)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint if script exists
        run: |
          if [ -f package.json ] && jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            npm run lint --if-present
          else
            echo "No lint script defined, skipping lint."
          fi

      - name: Run tests if script exists
        env:
          CI: true
        run: |
          if [ -f package.json ] && jq -e '.scripts.test' package.json >/dev/null 2>&1; then
            npm test -- --ci || npm test
          else
            echo "No test script defined, skipping tests."
          fi

      - name: Build if script exists
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            npm run build --if-present
          else
            echo "No build script defined, skipping build."
          fi
