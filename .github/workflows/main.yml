- name: Setup Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: '20'
      cache: 'npm'

  - name: Install dependencies (npm ci)
    run: |
      echo ">>> Installing dependencies"
      npm ci
    env:
      CI: true

  - name: TypeScript check (if tsc available)
    run: |
      echo ">>> Checking TypeScript (tsc --noEmit) if available"
      if npx -y tsc --noEmit 2>/dev/null; then
        echo "TypeScript check passed"
      else
        echo "No TypeScript check or tsc failed/skipped"
      fi

  - name: Run ESLint (if lint script exists)
    run: |
      echo ">>> Running ESLint if configured"
      if grep -q "\"lint\"" package.json; then
        echo "Found lint script — running npm run lint"
        npm run lint --silent
      else
        echo "No lint script found — skipping ESLint"
      fi

  - name: Run Jest tests (if test script exists)
    run: |
      echo ">>> Running Jest tests if configured"
      # We check for "test" script but ignore a default placeholder that might just be "echo..."
      if grep -q "\"test\"" package.json && ! grep -q "\"test\": \"echo" package.json; then
        echo "Found test script — running npm run test"
        npm run test --silent
      else
        echo "No real test script found — skipping Jest"
      fi

  - name: Build Next.js (production)
    run: |
      echo ">>> Building Next.js (npm run build)"
      npm run build
    env:
      NODE_ENV: production

  - name: Run Cypress (only if config exists)
    run: |
      echo ">>> Checking for Cypress configuration"
      if [ -f cypress.config.ts ] || [ -f cypress.config.js ]; then
        echo "Cypress config found — running Cypress headless"
        npx cypress run --headless
      else
        echo "No Cypress config found — skipping Cypress"
      fi

  - name: Final status
    run: |
      echo ">>> CI workflow finished for commit $GITHUB_SHA"
      echo "If any step failed earlier, check the job logs above."
