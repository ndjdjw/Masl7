name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Show environment (debug)
        run: |
          node -v
          npm -v
          ls -la
          cat package.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run unit tests (Jest) and collect coverage
        env:
          CI: true
        run: |
          mkdir -p coverage
          npm test -- --coverage --runInBand

      - name: Upload test coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      - name: Build Next.js
        env:
          NODE_ENV: production
        run: npm run build --if-present

      - name: Install Chrome deps for Cypress
        if: always()
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libnotify-dev libgconf-2-4 \
            libnss3 libxss1 libasound2 xvfb

      - name: Start local server for E2E (serve built Next)
        if: always()
        run: |
          # Start production server on port 3000; adjust if your start script differs.
          # Capture PID and redirect logs so we can debug if it fails.
          npm run start --if-present &> /tmp/next-start.log &
          echo $! > /tmp/next-start.pid || true
          sleep 1
          tail -n +1 /tmp/next-start.log || true

      - name: Wait for local server to be ready (http)
        run: |
          # try curl until we get a 200 or timeout
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:3000/_next/static/ -o /dev/null; then
              echo "server ready"
              exit 0
            fi
            echo "waiting for server... ($i)"
            sleep 2
          done
          echo "Server did not start on port 3000. Dumping log:"
          cat /tmp/next-start.log || true
          exit 1

      - name: Run Cypress E2E tests
        env:
          CI: true
        run: |
          npx cypress run --headless --browser chrome

      - name: Upload Cypress videos/screenshots (if any)
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore

      - name: Upload test-results (jest) (optional)
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: |
            jest-results.xml
            test-results
          if-no-files-found: ignore

      - name: Deploy to Netlify (optional)
        if: github.event_name != 'pull_request' && (secrets.NETLIFY_AUTH_TOKEN && secrets.NETLIFY_SITE_ID)
        uses: nwtgck/actions-netlify@v1.2
        with:
          publish-dir: .next
          production-branch: main
          enable-commit-comment: false
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Stop local server (cleanup)
        if: always()
        run: |
          if [ -f /tmp/next-start.pid ]; then
            kill $(cat /tmp/next-start.pid) || true
            rm -f /tmp/next-start.pid
          else
            pkill -f "node .*start" || true
          fi
          sleep 1
