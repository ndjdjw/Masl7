name: CI - Safe Run (manual + push)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  basic:
    name: Basic CI (safe lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (do not fail workflow if lint errors)
        run: |
          if [ -f package.json ] && jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            echo "Running lint (errors won't fail this job)..."
            npm run lint --if-present || echo "Lint had errors but continuing."
          else
            echo "No lint script defined, skipping lint."
          fi

      - name: Run tests if defined
        env:
          CI: true
        run: |
          if [ -f package.json ] && jq -e '.scripts.test' package.json >/dev/null 2>&1; then
            npm test -- --ci || npm test || echo "Tests failed or not configured; continuing."
          else
            echo "No test script defined, skipping tests."
          fi

      - name: Build if defined
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            npm run build --if-present || echo "Build failed or not configured; continuing."
          else
            echo "No build script defined, skipping build."
          fi
