steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Print runner info
    run: |
      echo "Runner: $(uname -a)"
      node -v
      npm -v

  - name: Install dependencies
    run: |
      npm ci

  - name: Build (production)
    env:
      NEXT_TELEMETRY_DISABLED: 1
    run: |
      set -e
      echo "Running npm run build..."
      npm run build

  - name: Lint
    env:
      NEXT_TELEMETRY_DISABLED: 1
    run: |
      echo "Running npm run lint..."
      npm run lint || (echo "Lint failed"; exit 1)

  - name: Run unit tests
    run: |
      echo "Running npm test..."
      npm test

  - name: Start production server (background)
    if: ${{ always() }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
    run: |
      if [ -d ".next" ]; then
        echo ".next exists — starting production server"
        nohup npm run start --if-present > server.log 2>&1 &
        echo $! > .server_pid
        sleep 2
        tail -n +1 server.log || true
      else
        echo ".next build output not found; skipping start"
        exit 0
      fi

  - name: Wait for server to be ready
    if: ${{ always() }}
    run: |
      if ! command -v curl >/dev/null 2>&1; then
        apt-get update && apt-get install -y curl
      fi
      echo "Waiting for http://localhost:3000/ ..."
      for i in {1..30}; do
        if curl -sSf http://localhost:3000/ >/dev/null 2>&1; then
          echo "Server is ready"
          exit 0
        fi
        sleep 1
      done
      echo "Server did not become ready in time"
      exit 1

  - name: Run Cypress (headless)
    if: ${{ always() }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
    run: |
      if npm run | grep -q "e2e:headless"; then
        echo "Running Cypress headless..."
        npm run e2e:headless || echo "Cypress returned non-zero exit code"
      else
        echo "No e2e:headless script found; skipping Cypress"
      fi

  - name: Upload server log (on failure)
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: server-log
      path: server.log
