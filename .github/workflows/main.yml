steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Use Node.js ${{ matrix.node-version }}
    uses: actions/setup-node@v4
    with:
      node-version: ${{ matrix.node-version }}
      cache: 'npm'

  - name: Install dependencies
    run: npm ci
    env:
      CI: true

  - name: TypeScript type check (if tsc present)
    run: |
      if command -v npx >/dev/null 2>&1 && npx tsc --noEmit; then
        echo "TypeScript OK"
      else
        echo "TypeScript check skipped or failed"
      fi
    continue-on-error: false

  - name: Run ESLint (if configured)
    run: |
      if grep -q "\"lint\"" package.json; then
        npm run lint --silent
      else
        echo "No lint script found, skipping ESLint"
      fi
    continue-on-error: false

  - name: Run Jest tests (if configured)
    run: |
      if grep -q "\"test\"" package.json; then
        npm run test --silent
      else
        echo "No test script found, skipping Jest"
      fi
    continue-on-error: false

  - name: Build Next.js
    run: npm run build
    env:
      NODE_ENV: production

  - name: Run Cypress tests (if cypress installed and script exists)
    run: |
      if [ -f cypress.config.ts ] || grep -q "cypress" package.json; then
        # Install Cypress binary (if needed) and run headless
        npx cypress run --headless || { echo "Cypress run failed"; exit 1; }
      else
        echo "No Cypress config or scripts found, skipping Cypress"
      fi
    continue-on-error: false
