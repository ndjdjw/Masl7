name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Show basic info (debug)
        run: |
          node -v
          npm -v
          ls -la
          cat package.json || true

      - name: Install deps
        run: npm ci

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Test (Jest) (if present)
        env:
          CI: true
        run: |
          if npm run | grep -q " test"; then
            npm test -- --runInBand || (echo "Jest failed" && exit 1)
          else
            echo "No test script present, skipping tests."
          fi

      - name: Build (Next.js)
        env:
          NODE_ENV: production
        run: |
          if npm run | grep -q " build"; then
            npm run build --if-present
          else
            echo "No build script present, skipping build."
          fi

      - name: Start server for E2E (if start script exists)
        if: always()
        run: |
          # Start only if start script exists
          if npm run | grep -q " start"; then
            npm run start --if-present &> /tmp/next-start.log &
            echo $! > /tmp/next-start.pid || true
            sleep 1
            tail -n +1 /tmp/next-start.log || true
          else
            echo "No start script present, skipping server start."
          fi

      - name: Wait for server (if started)
        run: |
          if [ -f /tmp/next-start.pid ]; then
            for i in $(seq 1 30); do
              if curl -sSf http://localhost:3000/_next/static/ -o /dev/null; then
                echo "server ready"
                exit 0
              fi
              echo "waiting ($i)..."
              sleep 2
            done
            echo "Server didn't start; dump log:"
            cat /tmp/next-start.log || true
            exit 1
          else
            echo "Server was not started, skipping wait."
          fi

      - name: Run Cypress (if installed)
        run: |
          if [ -d cypress ] || npx cypress --version >/dev/null 2>&1; then
            npx cypress run --headless --browser chrome || (echo "Cypress failed" && exit 1)
          else
            echo "No Cypress found, skipping E2E."
          fi

      - name: Upload artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: project-artifacts
          path: |
            coverage
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore

      # --- Guarded Netlify deploy via netlify-cli (safe: no secrets in if) ---
      - name: Check Netlify secrets presence
        if: github.event_name != 'pull_request'
        run: |
          echo "check NETLIFY secrets..."
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "NETLIFY secrets missing. Will skip deploy."
            echo "SKIP_NETLIFY=true" >> $GITHUB_ENV
          else
            echo "NETLIFY secrets present."
            echo "SKIP_NETLIFY=false" >> $GITHUB_ENV
          fi

      - name: Install netlify-cli (when secrets present)
        if: env.SKIP_NETLIFY == 'false'
        run: npm install -g netlify-cli

      - name: Run Netlify deploy (when secrets present)
        if: env.SKIP_NETLIFY == 'false'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          echo "Deploying to Netlify site: $NETLIFY_SITE_ID"
          netlify deploy --prod --dir=.next --site=$NETLIFY_SITE_ID

      - name: Cleanup (stop server)
        if: always()
        run: |
          if [ -f /tmp/next-start.pid ]; then
            kill $(cat /tmp/next-start.pid) || true
            rm -f /tmp/next-start.pid
          else
            pkill -f "node .*start" || true
          fi
