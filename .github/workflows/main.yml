steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install dependencies
    run: npm ci

  - name: Build (production)
    env:
      NEXT_TELEMETRY_DISABLED: 1
    run: npm run build

  - name: Lint
    env:
      NEXT_TELEMETRY_DISABLED: 1
    run: npm run lint

  - name: Run unit tests
    run: npm test

  - name: Start production server (background)
    if: always()
    env:
      NEXT_TELEMETRY_DISABLED: 1
    run: |
      if [ -d ".next" ]; then
        nohup npm run start --if-present > server.log 2>&1 &
        echo "Server started in background (logs -> server.log)"
      else
        echo ".next build output not found; skipping start"
      fi

  - name: Wait for server to be ready
    if: always()
    run: |
      for i in {1..30}; do
        if curl -sSf http://localhost:3000/ >/dev/null 2>&1; then
          echo "Server is ready"
          exit 0
        fi
        sleep 1
      done
      echo "Server did not become ready in time"

  - name: Run Cypress (headless)
    if: always()
    run: |
      if npm run | grep -q "e2e:headless"; then
        npm run e2e:headless
كىelse
        echo "No e2e:headless script found; skipping Cypress"
      fi
    continue-on-error: true

  - name: Upload server log (on failure)
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: server-log
      path: server.log
